<div class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
  <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wide mb-5">
    Enrollment Analytics
  </h3>

  <div class="space-y-4">
    @for (course of breakdown(); track course.courseName) {
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-sm font-medium text-gray-700">{{ course.courseName }}</span>
          <span class="text-xs text-gray-400">{{ course.total }} total</span>
        </div>
        <div class="h-3 w-full rounded-full bg-gray-100 overflow-hidden flex">
          <div
            class="h-full bg-green-500 transition-all duration-500"
            [style.width.%]="course.total > 0 ? (course.approved / course.total) * course.percentOfMax : 0"
          ></div>
          <div
            class="h-full bg-amber-400 transition-all duration-500"
            [style.width.%]="course.total > 0 ? (course.pending / course.total) * course.percentOfMax : 0"
          ></div>
        </div>
      </div>
    }
  </div>

  <div class="flex items-center gap-4 mt-5 pt-4 border-t border-gray-100">
    <span class="flex items-center gap-1.5 text-xs text-gray-500">
      <span class="h-2.5 w-2.5 rounded-full bg-green-500"></span> Approved
    </span>
    <span class="flex items-center gap-1.5 text-xs text-gray-500">
      <span class="h-2.5 w-2.5 rounded-full bg-amber-400"></span> Pending
    </span>
  </div>
</div>
